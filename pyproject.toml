[project]
name = "udsbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "english-to-ipa",
    "lxml[html-clean]>=5.3.2",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "plotly>=6.0.1",
    "pydantic>=2.11.3",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "ruff>=0.9.9",
    "wn>=1.1.0",
]

[tool.uv.sources]
english-to-ipa = { git = "https://github.com/mphilli/English-to-IPA", rev = "fda784a9a27a4b3be7260debc130e33b55210f6a" }

[tool.ruff.lint]
extend-select = ["C901", "PLR0912", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10
